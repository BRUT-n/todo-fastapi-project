# 1. ИСТОЧНИК: Читаем логи из Docker
[sources.docker_logs]
type = "docker_logs"
include_containers = ["todo_app_container"] # Слушаем только наш контейнер приложения

# 2. ТРАНСФОРМАЦИЯ: Парсим строки в честный JSON
[transforms.parse_json]
type = "remap"
inputs = ["docker_logs"]
source = """
# 1. Проверяем, что лог пришел в формате JSON
parsed, err = parse_json(string!(.message))

if err == null {
    # 2. Сохраняем текстовое сообщение во временную переменную
    app_message = parsed.message

    # 3. Безопасно вливаем ВСЕ поля из parsed в корень лога.
    # Используем 'merge', чтобы при конфликте типов Vector не дропал лог.
    ., merge_err = merge(., parsed)

    if merge_err == null {
        # 4. Возвращаем человекочитаемый текст в поле .message
        if app_message != null {
            .message = app_message
        }
    } else {
        .parse_error = "Merge failed: " + string!(merge_err)
    }
} else {
    # Если прилетит обычный текст (например, от других контейнеров), оставляем как есть
    .parse_error = "Not a JSON: " + string!(err)
}
"""

