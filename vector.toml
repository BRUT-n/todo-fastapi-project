# 3. НАЗНАЧЕНИЕ: Отправляем очищенные данные в OpenObserve
[sinks.openobserve]
type = "http"
inputs = ["parse_json"]
uri = "${OPENOBSERVE_URI}"
method = "post"
auth.strategy = "basic"
auth.user = "${OPENOBSERVE_USER}"
auth.password = "${OPENOBSERVE_PASSWORD}"
compression = "gzip"
encoding.codec = "json"
