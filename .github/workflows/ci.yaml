name: CI Quality Gate

on:
  push:
    branches:
      # - '**' # Запуск при любом пуше в любую ветку
      - main
      # - 'ci/**'
  pull_request:
    branches: [ main ] # Запуск при создании PR в ветку main

jobs:

  # Джоб: клонирование кода, установка uv, установка зависимостей, запуск линтера (без исправлений)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Clone code to runner
        uses: actions/checkout@v5

      - name: Install uv tool
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Linter
        run: make lint

  # Джоб: подготовка окружения и ключей (артефактов)
  prepare-artifacts:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Generate dummy public JWT key for testing
        run: |
          mkdir -p certs
          openssl genpkey -algorithm RSA -out certs/jwt-private-key.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in certs/jwt-private-key.pem -out certs/jwt-public-key.pem
          
          # Создаем фейковый .env для Docker Compose
          echo "POSTGRES_USER=test_user" >> .env
          echo "POSTGRES_PASSWORD=test_password" >> .env
          echo "POSTGRES_DB=test_db" >> .env

      # сохранить ключи и .env как артефакты, чтобы передать в следующие job
      - name: Upload generated certs and env
        uses: actions/upload-artifact@v7
        with:
          name: ci-test-artifacts
          path: |
            certs/
            .env
          include-hidden-files:
            true
          retention-days: 1

  # Джоб: клонирование кода, загрузка артефактов, установка uv, установка зависимостей, запуск юнит и апи тестов
  unit-and-api-tests:
    runs-on: ubuntu-latest
    needs: prepare-artifacts
    steps:
      - name: Clone code to runner
        uses: actions/checkout@v5

      # загрузка созданных раннее артефактов для работы с ними
      - name: Download generated certs and env
        uses: actions/download-artifact@v7
        with:
          name: ci-test-artifacts

      - name: Install uv tool
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run unit and api tests
        run: |
          make test-crud
          make test-auth
          make test-api

# Джоб: обновить версию приложения через Semantic Release
  release:
    runs-on: ubuntu-latest
    needs: unit-and-api-tests
    
    # GitHub-экшену права на запись (write), чтобы он мог сделать git commit 
    # с новым pyproject.toml и создать тег в репозитории.
    permissions:
      contents: write

    # Выносим результаты джоба наружу, чтобы следующий джоб мог их прочитать
    outputs:
      new_version: ${{ steps.sr.outputs.version }}

    steps:
      - name: Clone code to runner
        uses: actions/checkout@v5
        # по умолчанию качается только 1 коммит. Тут нужна '0' (вся история коммитов), 
        # чтобы утилита могла их прочитать и понять, насколько повышать версию.        
        with:
          fetch-depth: 0

      # Вызов Semantic Release
      - name: Python Semantic Release Action
        id: sr # Даем имя шагу, чтобы обращаться к его результатам
        uses: python-semantic-release/python-semantic-release@v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} # токен GitHub, чтобы бот мог пушить код

# ИЗМЕНЕННЫЙ ДЖОБ: Сборка докера
  docker-build:
    runs-on: ubuntu-latest
    needs: release

    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone code to runner
        uses: actions/checkout@v5
        with:
          # ВАЖНО: клонируем код заново.
          # Джоб release сделал новый коммит в ветку. 
          # Если не указать ref, скачается СТАРЫЙ код до релиза.
          ref: ${{ github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

        # НОВЫЙ ШАГ: Умная генерация тегов
      - name: Generate Docker tags
        id: generate-tags
        run: |
          # Базовые теги, которые нужны всегда (latest и уникальный хэш коммита)
          TAGS="ghcr.io/brut-n/todo-fastapi-project:latest,ghcr.io/brut-n/todo-fastapi-project:${{ github.sha }}"
          
          # Читаем версию от робота
          VERSION="${{ needs.release.outputs.new_version }}"
          
          # Если версия не пустая (робот сделал релиз), приклеиваем и её к списку
          if [ -n "$VERSION" ]; then
            TAGS="$TAGS,ghcr.io/brut-n/todo-fastapi-project:$VERSION"
          fi
          
          # Отдаем этот список наружу для следующего шага
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          # Берем готовую строку с тегами из предыдущего шага
          tags: ${{ steps.generate-tags.outputs.tags }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build

    # if: github.ref == 'refs/heads/ci/automated-quality-gate-#8' && github.event_name == 'push'
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
        # клон кода нв виртуалку GitHub, чтобы получить доступ к файлу docker-compose.yml
      - name: Clone code to the runner
        uses: actions/checkout@v5

      # копировать docker-compose.yml в проекте из раннера на сервер
      - name: Copy docker-compose.yml to server via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{secrets.VDS_IP}}
          username: ${{secrets.VDS_USER}}
          key: ${{secrets.SSH_KEY}}
          port: 22
          # берет из корня проекта, если надо из папки то писать целевой путь
          source: "docker-compose.yml"
          target: "/var/www/todo-app"

      # 3. Подключаемся по SSH и управляем только Докером (БЕЗ GIT!)
      - name: Execute deploy commands via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{secrets.VDS_IP}}
          username: ${{secrets.VDS_USER}}
          key: ${{secrets.SSH_KEY}}
          port: 22
          script: |
            cd /var/www/todo-app/todo-fastapi-project

            # Подтягиваем свежесобранный образ из GHCR
            docker compose pull app

            # Запускаем контейнеры. Инструкция '--wait' подождет healthcheck
            docker compose up -d --wait

            # Очищаем старые ненужные сборки, чтобы не забивать диск сервера
            docker image prune -f

  # Джоб: итоговые тесты Е2Е на целевом сервере после деплоя
  e2e_tests:
    runs-on: ubuntu-latest
    needs: deploy

    # Переменные окружения
    env:
      #  Вложенность Pydantic:auth__имя_переменной (ПОРТ В ПЕРМЕННУЮ)
      app__E2E_BASE_URL: http://${{secrets.VDS_IP}}:${{secrets.API_PORT}} 

    steps:
      # код на сервер GitHub через плагин
      - name: Clone code to runner
        uses: actions/checkout@v5

      # Создаем пустые файлы-заглушки, чтобы pytest не ругался при импортах
      - name: Create dummy certs for pytest verification
        run: |
          mkdir -p certs
          openssl genpkey -algorithm RSA -out certs/jwt-private-key.pem -pkeyopt rsa_keygen_bits:2048
          openssl rsa -pubout -in certs/jwt-private-key.pem -out certs/jwt-public-key.pem

          # mkdir -p certs
          # touch certs/dummy-private.pem
          # touch certs/dummy-public.pem

      # Установка `uv` через их плагин
      - name: Install uv tool
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      # Устновка необходимых зависимостей из uv.lock / pyproject.toml
      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run E2E tests after deploy
        run: make test-e2e
