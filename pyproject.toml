[project]
name = "todo-app-project"
version = "2.0.3"
description = "My TO DO lists project FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.128.0",
    "numpy>=2.4.1",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.12.5",
    "pyjwt[crypto]>=2.11.0",
    "python-multipart>=0.0.22",
    "sqlalchemy>=2.0.46",
    "sqlalchemy-orm>=1.2.10",
    "typing>=3.10.0.0",
    "uvicorn>=0.40.0",
]

# КОНФИГУРАЦИЯ PYTHON-SEMANTIC-RELEASE
[tool.semantic_release]
# Указываем формат тега (например, v0.1.0). По умолчанию используется "v{version}"
tag_format = "v{version}"

# Раздел файлов, в которых нужно автоматизировать замену строки версии
# Утилита сама найдет и обновит версию в pyproject.toml
version_toml = [
    "pyproject.toml:project.version"
]

# Настройка публикации изменений обратно в репозиторий
[tool.semantic_release.git_author]
name = "github-actions[bot]"
email = "41898282+github-actions[bot]@users.noreply.github.com"

[tool.ruff]
src = ["src"] # указание исходного кода проетка (пути и импорты)
line-length = 88 # максимальная длина строки
target-version = "py312" # указание версии питона
exclude = ["alembic"] 

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (ошибки стиля PEP8)
    "W",   # pycodestyle warnings (предупреждения стиля)
    "F",   # Pyflakes (логические ошибки, забытые импорты)
    "I",   # isort (автоматическая сортировка импортов по алфавиту)
    "B",   # flake8-bugbear (поиск скрытых багов и опасного кода)
    "UP",  # pyupgrade (подсказки по обновлению синтаксиса до Python 3.12)
]
ignore = []
# ignore = ["E501"]

[tool.ruff.format]
# Все строки в проекте автоматически приводятся к двойным кавычкам
quote-style = "double"

[tool.pyright]
# Указываем Pyright, где искать исходный код приложения
include = ["src", "tests"]
# Включаем стандартный режим проверки типов (идеально для FastAPI)
typeCheckingMode = "standard"
# Python будет ругаться на неиспользуемые импорты, но мы отдаем эту задачу Ruff
reportUnusedImport = false 

[tool.ruff.lint.isort]
# Указывает что папки внутри src — это свои модули, а не внешние
known-first-party = ["todo-app-project"]

[tool.ruff.lint.flake8-bugbear]
# Разрешить использовать эти функции FastAPI в аргументах по умолчанию
extend-immutable-calls = [
    "fastapi.Depends", 
    "fastapi.params.Depends", 
    "fastapi.Query", 
    "fastapi.params.Query",
    "fastapi.Path", 
    "fastapi.params.Path",
    "fastapi.Body", 
    "fastapi.params.Body"
]

[dependency-groups]
dev = [
    "datetime>=6.0",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "testcontainers[postgres]>=4.14.2",
]

[tool.pytest.ini_options]
# 1. Где искать исходный код проекта
pythonpath = ["."]

# указывает где искать тесты
testpaths = ["tests"]

# 2. Как обрабатывать асинхронные тесты
asyncio_mode = "auto"

# 3. Время жизни цикла событий по умолчанию
asyncio_default_fixture_loop_scope = "session"
